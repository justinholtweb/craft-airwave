<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, matching Appleseed's rx="35" on a 156px square -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#5B2FA8"/>
  <!-- A broadcast mast: the signal going out, the signal coming in, and the same aerial for both. -->
  <g fill="none" stroke="#FEFEFE" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 40V80"/>
    <path d="M34 80 L50 56 L66 80"/>
  </g>
  <circle cx="50" cy="30" r="6" fill="#FEFEFE"/>
  <g fill="none" stroke="#FEFEFE" stroke-width="6" stroke-linecap="round">
    <!-- Inner pair, r=18 -->
    <path d="M35.26 19.68a18 18 0 0 0 0 20.64"/>
    <path d="M64.74 19.68a18 18 0 0 1 0 20.64"/>
    <!-- Outer pair, r=30 -->
    <path d="M25.43 12.79a30 30 0 0 0 0 34.42"/>
    <path d="M74.57 12.79a30 30 0 0 1 0 34.42"/>
  </g>
</svg>
